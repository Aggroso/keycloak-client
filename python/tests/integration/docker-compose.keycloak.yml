version: "3.8"
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --http-enabled=true --hostname-strict=false
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/realms/master"]
      interval: 10s
      timeout: 5s
      retries: 20
